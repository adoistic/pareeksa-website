  <path d="M62 56 c-8 -8 -16 0 -4 8 c12 8 12 -8 24 0 c12 8 4 16 -4 8" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 2" />
  <circle cx="62" cy="56" r="3.5" class="accent-fill" stroke="#16181D" stroke-width="1.25" />
