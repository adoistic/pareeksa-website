<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="100%" height="100%">
  <defs><style>
    .bg-blob { fill: #EEF2FF; opacity: 0.85; }
    .bg-blob-2 { fill: #E0E7FF; opacity: 0.6; }
    .outline { stroke: #16181D; stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .outline-thick { stroke: #16181D; stroke-width: 2.2px; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .outline-thin { stroke: #16181D; stroke-width: 1px; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .skin { fill: #FED7AA; stroke: #16181D; stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; }
    .hair { fill: #334155; stroke: #16181D; stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; }
    .shirt { fill: #1D4ED8; stroke: #16181D; stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; }
    .pants { fill: #475569; stroke: #16181D; stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; }
    .accent-fill { fill: #1D4ED8; }
    .accent-stroke { stroke: #1D4ED8; stroke-width: 2px; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .pastel-blue { fill: #EEF2FF; stroke: #16181D; stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; }
    .pastel-yellow { fill: #FEF9C3; stroke: #16181D; stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; }
    .pastel-green { fill: #D1FAE5; stroke: #16181D; stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; }
    .white-card { fill: #FFFFFF; stroke: #16181D; stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; }
    .shadow-line { stroke: #626875; stroke-width: 1px; stroke-linecap: round; opacity: 0.35; }
    .sparkle { fill: #F59E0B; }
    .plant { fill: #34D399; stroke: #16181D; stroke-width: 1.25px; }
</style></defs>
  <circle cx="80" cy="45" r="34" class="bg-circle" />
  
  <!-- Overlapping documents -->
  <rect x="35" y="24" width="30" height="38" rx="2" class="white-card" />
  <text x="50" y="47" font-size="14" font-family="sans-serif" font-weight="bold" fill="#626875" text-anchor="middle">A</text>
  
  <rect x="95" y="24" width="30" height="38" rx="2" class="white-card" stroke="#1D4ED8" stroke-width="2" />
  <text x="110" y="47" font-size="14" font-family="sans-serif" font-weight="bold" fill="#1D4ED8" text-anchor="middle">अ</text>

  <!-- Swapping character in middle -->
  <path d="M72 58 c0 -8 16 -8 16 0 v14 H72 Z" class="shirt" />
  <circle cx="80" cy="48" r="5.5" class="skin" />
  <path d="M80 58 Q65 52 50 48 M80 58 Q95 52 110 48" fill="none" class="outline" style="stroke-width:2.5; stroke:#FED7AA;" />
  <path d="M80 58 Q65 52 50 48 M80 58 Q95 52 110 48" fill="none" class="outline" />
</svg>